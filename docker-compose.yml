services:
  redis:
    image: redis:7-alpine
    container_name: taskq-redis
    ports:
      - "6379:6379"
    # appendonly persistence: Redis writes every change to an append-only file
    # so jobs survive a Redis restart. This matters later when we test
    # durability. Tradeoff: a small write-latency cost vs. losing queued/
    # in-flight jobs if the broker process dies.
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      # Compose can tell the container is actually ready (not just started) by
      # polling PING. Useful once workers depend on Redis being up.
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  redis-data:
