[pytest]
testpaths = tests
python_files = test_*.py
# Put the repo root on sys.path so `import taskq` resolves. Running
# `python -m pytest` adds the working directory automatically, but the bare
# `pytest` console script (what CI invokes) does not - without this the
# suite passes locally and fails in CI.
pythonpath = .
# Every test talks to a local Redis at most; nothing should take a minute.
# A hang means a deadlock or a lost job, which is exactly what we want to
# fail loudly rather than wait on.
timeout = 60
addopts = -q --strict-markers
